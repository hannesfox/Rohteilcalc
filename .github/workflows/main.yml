name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        # crt-static: die C-Laufzeit wird in die .exe eingebaut, damit auf dem
        # Zielrechner kein Visual-C++-Redistributable installiert sein muss.
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked

      - name: DXC v1.9.2609 herunterladen und SHA256 prüfen
        shell: pwsh
        run: |
          # Pin: neueste stabile DXC-Veröffentlichung (microsoft/DirectXShaderCompiler).
          # Der SHA256 des ZIPs wird mit Get-FileHash geprüft (Job schlägt
          # fehl, wenn es nicht übereinstimmt).
          $url = "https://github.com/microsoft/DirectXShaderCompiler/releases/download/v1.9.2609/dxc_2026_09_29.zip"
          $zip = "$env:TEMP/dxc_2026_09_29.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          $expected = "ad31b1fc8443175d204f77a611fdb3ef2ec42759bdc2f1167368de24a4a7e7f1"
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash
          Write-Output "DXC-Zip-SHA256: $actual (erwartet: $expected)"
          if ($actual -ine $expected) { Write-Error "SHA256-Mismatch bei $url"; exit 1 }

      - name: DXC-DLLs und Lizenz in dist/ kopieren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $x64 = "$env:TEMP/dxc_x64"
          Expand-Archive -Path "$env:TEMP/dxc_2026_09_29.zip" -DestinationPath $x64 -Force
          # x64-Varianten nach dist/ neben dem .exe (arm64/x86 bleiben unberührt).
          $dlls = Get-ChildItem -Recurse -LiteralPath $x64 -Include @("dxcompiler.dll", "dxil.dll") |
            Where-Object { $_.DirectoryName -like "*x64" }
          foreach ($dll in $dlls) {
            Copy-Item -Force -LiteralPath $dll.FullName -Destination (Join-Path dist $dll.Name)
          }
          # Redistributions-Lizenz (LICENSE-LLVM / MIT / MS) als DXC-LICENSE.txt.
          $licDest = "dist/DXC-LICENSE.txt"
          Remove-Item -Force $licDest -ErrorAction SilentlyContinue
          foreach ($lic in Get-ChildItem -Recurse -LiteralPath $x64 -Include @("LICENSE-LLVM.txt", "LICENCE-MIT.txt", "LICENSE-MS.txt")) {
            Add-Content -Path $licDest -Value ("=== $($lic.Name) ===`n" + (Get-Content -Raw -LiteralPath $lic.FullName))
          }

      - name: Paket schnüren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/rohteil_calc.exe dist/Rohteilcalc.exe
          Copy-Item assets/logo.png dist/logo.png
          Copy-Item README.md dist/README.md
          # DXC v1.9.2609: dxcompiler.dll + dxil.dll + DXC-LICENSE.txt kommen
          # (aus den DXC-Schritten darüber) mit ins Zip – und dann auf den
          # Zielrechner.
          Compress-Archive -Path dist/* -DestinationPath RohteilCalc-windows-x64.zip -Force

      - name: DXC-DLLs prüfen
        shell: pwsh
        run: |
          $fehler = $false
          foreach ($dll in @("dist/dxcompiler.dll", "dist/dxil.dll")) {
            if (Test-Path $dll) {
              Write-Output "OK: $dll  SHA256: $(Get-FileHash -Path $dll -Algorithm SHA256).Hash"
            } else {
              Write-Output "FEHLER: $dll fehlt"; $fehler = $true
            }
          }
          if ($fehler) { exit 1 }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: RohteilCalc-windows-x64
          path: Rohteilcalc-windows-x64.zip
          if-no-files-found: error

      - name: "Smoke-Test: Rohteilcalc.exe --diag"
        shell: pwsh
        run: |
          $report = dist\Rohteilcalc.exe --diag 2>&1
          Write-Output $report
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Smoke-Test: --diag beendete mit Exit-Code $LASTEXITCODE"
            exit 1
          }
          # Log für den Artifact einsammeln (%TEMP% bzw. %RUNNER_TEMP%).
          $log = "$env:TEMP/Rohteilcalc.log"
          if (-not (Test-Path $log)) { $log = "$env:RUNNER_TEMP/Rohteilcalc.log" }
          if (Test-Path $log) {
            Copy-Item -Force $log "$env:GITHUB_WORKSPACE/rohteilcalc-startup-diagnose.log"
          } else {
            Write-Output "Warnung: Rohteilcalc.log nicht gefunden (Temp: '$env:TEMP', RunnerTemp: '$env:RUNNER_TEMP')"
          }

      - name: Startup-Diagnose hochladen
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rohteilcalc-startup-diagnose
          path: rohteilcalc-startup-diagnose.log
          if-no-files-found: warn

  macos:
    name: macOS (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Universal-Binary erzeugen
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/rohteil_calc \
            target/x86_64-apple-darwin/release/rohteil_calc \
            -output target/universal-apple-darwin/release/rohteil_calc

      - name: .app-Bundle erstellen
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          APP="dist/Rohteilcalc.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/universal-apple-darwin/release/rohteil_calc "$APP/Contents/MacOS/Rohteilcalc"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Rohteilcalc</string>
            <key>CFBundleDisplayName</key>
            <string>Rohteilcalc</string>
            <key>CFBundleIdentifier</key>
            <string>de.hannesfox.rohteilcalc</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>Rohteilcalc</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Signieren (ad-hoc) und zippen
        run: |
          codesign --force --deep --sign - dist/Rohteilcalc.app
          ditto -c -k --keepParent dist/Rohteilcalc.app Rohteilcalc-macos-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rohteilcalc-macos-universal
          path: Rohteilcalc-macos-universal.zip
          if-no-files-found: error

  release:
    name: Release
    # Bei Tags (v*) UND bei jedem Push auf main, aber nicht bei Pull Requests.
    if: github.event_name != 'pull_request'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Artifacts herunterladen
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Push auf main / manueller Start: Tag "latest" auf den aktuellen Commit
      # verschieben, damit immer ein öffentliches, login-freies Release existiert.
      - name: Tag "latest" aktualisieren
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Release "latest" veröffentlichen
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Rohteilcalc (aktueller Stand)
          body: |
            Automatischer Build des neuesten Stands von `main`.
            Windows: `Rohteilcalc-windows-x64.zip` entpacken und `Rohteilcalc.exe` starten.
            macOS: `Rohteilcalc-macos-universal.zip` entpacken.
          files: |
            artifacts/Rohteilcalc-windows-x64/Rohteilcalc-windows-x64.zip
            artifacts/Rohteilcalc-macos-universal/Rohteilcalc-macos-universal.zip

      - name: Release für Versions-Tag veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Rohteilcalc-windows-x64/Rohteilcalc-windows-x64.zip
            artifacts/Rohteilcalc-macos-universal/Rohteilcalc-macos-universal.zip
          generate_release_notes: true