name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (x86_64-pc-windows-msvc)
        # crt-static: die C-Laufzeit wird in die .exe eingebaut, damit auf dem
        # Zielrechner kein Visual-C++-Redistributable installiert sein muss.
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: EXE prüfen
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/rohteil_calc.exe"
          if (-not (Test-Path $exe)) { Write-Error "EXE fehlt: $exe"; exit 1 }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 1000000 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
            Write-Error "keine gültige PE-EXE (MZ fehlt)"; exit 1
          }
          $item = Get-Item $exe
          Write-Output "EXE: $($item.FullName)  $($item.Length) Bytes  Version $($item.VersionInfo.ProductVersion)"
          if ($item.VersionInfo.ProductName -ne "Rohteilcalc") {
            Write-Error "Windows-Ressourcen (Icon/ProductName) fehlen"; exit 1
          }

      - name: Unit-Tests (Windows)
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"
          PE_TEST_EXE: "${{ github.workspace }}/target/x86_64-pc-windows-msvc/release/rohteil_calc.exe"
        run: cargo test --locked --target x86_64-pc-windows-msvc --bin rohteil_calc

      - name: Paket schnüren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/rohteil_calc.exe dist/Rohteilcalc.exe
          Copy-Item assets/logo.png dist/logo.png
          Copy-Item README.md dist/README.md
          # Keine DXC-DLLs: wgpu nutzt standardmäßig FXC (in Windows enthalten).
          # Die EXE hat statische CRT und läuft ohne Rust/VC++-Redistributable.
          Compress-Archive -Path dist/* -DestinationPath Rohteilcalc-windows-x64.zip -Force
          $zip = Get-Item Rohteilcalc-windows-x64.zip
          Write-Output "ZIP: $($zip.Length) Bytes"

      - name: "Smoke-Test: Rohteilcalc.exe --diag"
        shell: pwsh
        run: |
          # GUI-Subsystem-Exe: PowerShell wartet nicht auf sie und setzt
          # $LASTEXITCODE nicht – Start-Process + WaitForExit und echter ExitCode.
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path "dist\Rohteilcalc.exe").Path
          [void]$psi.ArgumentList.Add("--diag")
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          $out = $p.StandardOutput.ReadToEndAsync()
          $err = $p.StandardError.ReadToEndAsync()
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Error "--diag Timeout (3 min)"; exit 1 }
          $report = $out.Result
          Write-Output $report
          Write-Output $err.Result
          if ($p.ExitCode -ne 0) { Write-Error "--diag beendete mit Exit-Code $($p.ExitCode)"; exit 1 }
          foreach ($needle in @("Betriebssystem:", "Ausgewähltes Backend:", "DX12-Shader-Compiler:", "Adapter", "DLL-Abhängigkeit: kernel32.dll")) {
            if (-not $report.Contains($needle)) { Write-Error "--diag-Bericht fehlt: $needle"; exit 1 }
          }
          if ($report -match "DLL-Abhängigkeit: (vcruntime|msvcp|dxcompiler|dxil)\.dll") {
            Write-Error "EXE benötigt eine nicht mitgelieferte DLL"; exit 1
          }

      - name: "Starttest: normale GUI bleibt nach dem Start lauffähig"
        shell: pwsh
        run: |
          # windows-latest stellt eine interaktive Desktop-Sitzung bereit
          # (wie SolidCrafts windows-startup-Job). Auf Systemen ohne Desktop
          # bricht winit sofort ab – der Test erkennt das über HasExited.
          $log = Join-Path $env:TEMP "Rohteilcalc.log"
          Remove-Item -Force $log -ErrorAction SilentlyContinue
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path "dist\Rohteilcalc.exe").Path
          $psi.UseShellExecute = $false
          $psi.WorkingDirectory = (Resolve-Path "dist").Path
          $p = [System.Diagnostics.Process]::Start($psi)
          Start-Sleep -Seconds 12
          $p.Refresh()
          if ($p.HasExited) {
            Write-Error "GUI-Prozess ist während der Initialisierung beendet (Exit-Code $($p.ExitCode))"
            exit 1
          }
          Write-Output "GUI-Prozess läuft nach 12 s (PID $($p.Id))"
          $startupLog = Get-Content -Raw $log -ErrorAction SilentlyContinue
          foreach ($needle in @("Grafik-Backend gewählt:", "CreationCallback", "Render-Pipelines installiert")) {
            if (-not $startupLog -or -not $startupLog.Contains($needle)) {
              Write-Error "Start-Log fehlt Phase: $needle"; $p.Kill(); exit 1
            }
          }
          if ($startupLog -match "GPU-Fehler:|Pipeline-Fehler:|Panic:") {
            Write-Error "GPU-Fehler im Start-Log"; $p.Kill(); exit 1
          }
          [void]$p.CloseMainWindow()
          if (-not $p.WaitForExit(20000)) { $p.Kill(); Write-Error "GUI schloss nicht"; exit 1 }
          Write-Output "GUI beendet mit Exit-Code $($p.ExitCode)"

      - name: "Smoke-Test: Headless-Rendering (--render)"
        shell: pwsh
        run: |
          # Ohne WGPU_BACKEND wählt --render auf Windows jetzt selbst DX12+FXC.
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path "dist\Rohteilcalc.exe").Path
          foreach ($a in @("--render", "examples\ci_cube.step", "dist\smoke.bmp")) { [void]$psi.ArgumentList.Add($a) }
          $psi.UseShellExecute = $false
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $p = [System.Diagnostics.Process]::Start($psi)
          $out = $p.StandardOutput.ReadToEndAsync()
          $err = $p.StandardError.ReadToEndAsync()
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Error "--render Timeout (5 min)"; exit 1 }
          Write-Output $out.Result
          Write-Output $err.Result
          if ($p.ExitCode -ne 0) { Write-Error "--render beendete mit Exit-Code $($p.ExitCode)"; exit 1 }
          if (-not (Test-Path dist\smoke.bmp)) { Write-Error "smoke.bmp fehlt"; exit 1 }
          if ((Get-Item dist\smoke.bmp).Length -lt 100000) { Write-Error "smoke.bmp verdächtig klein"; exit 1 }

      - name: Diagnose-Logs sammeln
        if: always()
        shell: pwsh
        run: |
          # Rohteilcalc.log (letzter Lauf: --render) und Rohteilcalc.prev.log
          # (Vorläufer: --diag) ins Workspace holen (%TEMP% bzw. %RUNNER_TEMP%).
          foreach ($pair in @(
            @("Rohteilcalc.log", "rohteilcalc-startup-diagnose.log"),
            @("Rohteilcalc.prev.log", "rohteilcalc-startup-diagnose.prev.log")
          )) {
            $src = "$env:TEMP/$($pair[0])"
            if (-not (Test-Path $src)) { $src = "$env:RUNNER_TEMP/$($pair[0])" }
            if (Test-Path $src) { Copy-Item -Force $src "$env:GITHUB_WORKSPACE/$($pair[1])" }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rohteilcalc-windows-x64
          path: Rohteilcalc-windows-x64.zip
          if-no-files-found: error

      - name: Startup-Diagnose hochladen
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Rohteilcalc-startup-diagnose
          path: |
            rohteilcalc-startup-diagnose.log
            rohteilcalc-startup-diagnose.prev.log
          if-no-files-found: warn

  macos:
    name: macOS (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Universal-Binary erzeugen
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/rohteil_calc \
            target/x86_64-apple-darwin/release/rohteil_calc \
            -output target/universal-apple-darwin/release/rohteil_calc

      - name: "Smoke-Tests: --diag und --inspect (macOS)"
        run: |
          BIN=target/universal-apple-darwin/release/rohteil_calc
          "$BIN" --diag | tee macos-diag.txt
          grep -q "Betriebssystem:" macos-diag.txt
          grep -q "Ausgewähltes Backend:" macos-diag.txt
          grep -q "Adapter" macos-diag.txt
          "$BIN" --inspect examples/ci_cube.step
          # Headless-Rendering nur, wenn der Runner tatsächlich einen
          # Metal-Adapter meldet (sonst nicht als Fehler werten).
          if grep -q "Adapter 0:" macos-diag.txt; then
            mkdir -p dist
            "$BIN" --render examples/ci_cube.step dist/macos-smoke.bmp
            test -s dist/macos-smoke.bmp
          else
            echo "Kein Metal-Adapter auf dem Runner: --render übersprungen."
          fi

      - name: .app-Bundle erstellen
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          APP="dist/Rohteilcalc.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/universal-apple-darwin/release/rohteil_calc "$APP/Contents/MacOS/Rohteilcalc"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Rohteilcalc</string>
            <key>CFBundleDisplayName</key>
            <string>Rohteilcalc</string>
            <key>CFBundleIdentifier</key>
            <string>de.hannesfox.rohteilcalc</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>Rohteilcalc</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Signieren (ad-hoc) und zippen
        run: |
          codesign --force --deep --sign - dist/Rohteilcalc.app
          ditto -c -k --keepParent dist/Rohteilcalc.app Rohteilcalc-macos-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rohteilcalc-macos-universal
          path: Rohteilcalc-macos-universal.zip
          if-no-files-found: error

  release:
    name: Release
    # Bei Tags (v*) UND bei jedem Push auf main, aber nicht bei Pull Requests.
    if: github.event_name != 'pull_request'
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Artifacts herunterladen
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Push auf main / manueller Start: Tag "latest" auf den aktuellen Commit
      # verschieben, damit immer ein öffentliches, login-freies Release existiert.
      - name: Tag "latest" aktualisieren
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest
          git push -f origin latest

      - name: Release "latest" veröffentlichen
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: RohteilCalc (aktueller Stand)
          fail_on_unmatched_files: true
          body: |
            Automatischer Build des neuesten Stands von `main`.
            Windows: `Rohteilcalc-windows-x64.zip` entpacken und `Rohteilcalc.exe` starten.
            macOS: `Rohteilcalc-macos-universal.zip` entpacken.
          files: |
            artifacts/Rohteilcalc-windows-x64/Rohteilcalc-windows-x64.zip
            artifacts/Rohteilcalc-macos-universal/Rohteilcalc-macos-universal.zip

      - name: Release für Versions-Tag veröffentlichen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            artifacts/Rohteilcalc-windows-x64/Rohteilcalc-windows-x64.zip
            artifacts/Rohteilcalc-macos-universal/Rohteilcalc-macos-universal.zip
          generate_release_notes: true