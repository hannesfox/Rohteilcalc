name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Paket schnüren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/rohteil_calc.exe dist/Rohteilcalc.exe
          Copy-Item assets/logo.png dist/logo.png
          Copy-Item README.md dist/README.md
          Compress-Archive -Path dist/* -DestinationPath Rohteilcalc-windows-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rohteilcalc-windows-x64
          path: Rohteilcalc-windows-x64.zip
          if-no-files-found: error

  macos:
    name: macOS (.app)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Build (Apple Silicon + Intel)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Universal-Binary erzeugen
        run: |
          mkdir -p target/universal-apple-darwin/release
          lipo -create \
            target/aarch64-apple-darwin/release/rohteil_calc \
            target/x86_64-apple-darwin/release/rohteil_calc \
            -output target/universal-apple-darwin/release/rohteil_calc

      - name: .app-Bundle erstellen
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          APP="dist/Rohteilcalc.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/universal-apple-darwin/release/rohteil_calc "$APP/Contents/MacOS/Rohteilcalc"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Rohteilcalc</string>
            <key>CFBundleDisplayName</key>
            <string>Rohteilcalc</string>
            <key>CFBundleIdentifier</key>
            <string>de.hannesfox.rohteilcalc</string>
            <key>CFBundleVersion</key>
            <string>${VERSION}</string>
            <key>CFBundleShortVersionString</key>
            <string>${VERSION}</string>
            <key>CFBundleExecutable</key>
            <string>Rohteilcalc</string>
            <key>CFBundleIconFile</key>
            <string>icon.icns</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>11.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Signieren (ad-hoc) und zippen
        run: |
          codesign --force --deep --sign - dist/Rohteilcalc.app
          ditto -c -k --keepParent dist/Rohteilcalc.app Rohteilcalc-macos-universal.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rohteilcalc-macos-universal
          path: Rohteilcalc-macos-universal.zip
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Artifacts herunterladen
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/Rohteilcalc-windows-x64/Rohteilcalc-windows-x64.zip
            artifacts/Rohteilcalc-macos-universal/Rohteilcalc-macos-universal.zip
          generate_release_notes: true
